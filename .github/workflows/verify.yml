name: Verify benchmark data and evaluation
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: pocketbench verify
      # External labels are not fetched automatically in CI.
      # Full rescoring is an explicit local prepare + evaluate step.
